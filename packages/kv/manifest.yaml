name: kv
description: Key-value storage with CAS and conditional writes
language: typescript
defaultAdapter: memory

exclude:
  - "*.spec.ts"
  - "*.test.ts"
  - "__tests__"
  - "__test__"

copy:
  - from: src/ports
    to: "{{targetDir}}/kv/ports"
  - from: src/core
    to: "{{targetDir}}/kv/core"

requires:
  - clock

adapters:
  memory:
    description: In-memory KV adapter
    copy:
      - from: src/adapters/memory
        to: "{{targetDir}}/kv/adapters/memory"
  redis:
    description: Redis-backed KV adapter
    copy:
      - from: src/adapters/utils
        to: "{{targetDir}}/kv/adapters/utils"
      - from: src/adapters/redis
        to: "{{targetDir}}/kv/adapters/redis"
    deps:
      - redis
