name: secrets
description: Secret vault ports with cloud and local adapters
language: typescript
defaultAdapter: memory

exclude:
  - "*.spec.ts"
  - "*.test.ts"
  - "__test__"
  - "__tests__"
  - "tests"

copy:
  - from: src/ports
    to: "{{targetDir}}/secrets/ports"

requires:
  - clock

adapters:
  aws-secrets-manager:
    description: AWS Secrets Manager vault adapter
    copy:
      - from: src/adapters/aws/aws-secrets-manager-vault.ts
        to: "{{targetDir}}/secrets/adapters/aws"
    deps:
      - "@aws-sdk/client-secrets-manager"
  aws-ssm:
    description: AWS SSM Parameter Store vault adapter
    copy:
      - from: src/adapters/aws/aws-ssm-vault.ts
        to: "{{targetDir}}/secrets/adapters/aws"
    deps:
      - "@aws-sdk/client-ssm"
  env:
    description: Read-only environment variable secret vault
    copy:
      - from: src/adapters/env
        to: "{{targetDir}}/secrets/adapters/env"
  fs:
    description: JSON file secret vault
    copy:
      - from: src/adapters/fs
        to: "{{targetDir}}/secrets/adapters/fs"
  gcp:
    description: Google Secret Manager vault adapter
    copy:
      - from: src/adapters/gcp
        to: "{{targetDir}}/secrets/adapters/gcp"
    deps:
      - "@google-cloud/secret-manager"
  memory:
    description: In-memory secret vault
    copy:
      - from: src/adapters/memory
        to: "{{targetDir}}/secrets/adapters/memory"
