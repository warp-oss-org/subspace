name: dev-to-main-pr

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dev-to-main-pr
  cancel-in-progress: true

jobs:
  ensure-promotion-pr:
    name: Ensure dev to main promotion PR
    runs-on: ubuntu-24.04
    steps:
      - name: Ensure rolling dev to main PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const base = "main"
            const headBranch = "dev"
            const head = `${owner}:${headBranch}`

            const { data: pullRequests } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base,
              head,
              per_page: 100,
            })

            if (pullRequests.length > 0) {
              core.info(`Found existing open promotion PR #${pullRequests[0].number}; nothing to do.`)
              return
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${base}...${headBranch}`,
            })

            if (comparison.ahead_by === 0) {
              core.info("dev is not ahead of main; no promotion PR needed.")
              return
            }

            const title = "Release candidate: dev to main"
            const body = [
              "This is the rolling promotion PR from `dev` to `main`.",
              "",
              "- Pushes to `dev` update this PR automatically.",
              "- Merging this PR promotes the current `dev` tip to `main`.",
              "- Releases are still cut manually from `main` via `registry-release`.",
            ].join("\n")

            const { data: pullRequest } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head: headBranch,
              base,
              body,
              draft: false,
            })

            core.info(`Created promotion PR #${pullRequest.number}.`)
