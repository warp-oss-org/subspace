name: subspace-cli-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Protected Subspace CLI release tag, for example subspace-cli-v2026.04.11.1
        required: true
        type: string
      source_sha:
        description: Exact source commit SHA to release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: subspace-cli-release-${{ inputs.release_version }}
  cancel-in-progress: false

jobs:
  verify-input:
    name: Verify release input
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Fetch protected branch
        run: git fetch --no-tags origin main

      - name: Validate release inputs
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$RELEASE_VERSION" != ""
          test "$SOURCE_SHA" != ""
          case "$RELEASE_VERSION" in
            subspace-cli-v*) ;;
            *)
              echo "release_version must start with subspace-cli-v" >&2
              exit 1
              ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "source_sha must be a 40-character git commit SHA" >&2
            exit 1
          }
          git rev-parse --verify "${SOURCE_SHA}^{commit}" >/dev/null 2>&1
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/main"

  node-validation:
    name: Node validation
    needs: verify-input
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      node_version: "24"
      source_sha: ${{ inputs.source_sha }}
      upload_coverage: false
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  cli-validation:
    name: CLI validation
    needs: verify-input
    uses: ./.github/workflows/reusable-cli-registry-ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      build_binary: true
      binary_output_path: /tmp/subspace-cli-linux-amd64
      run_smoke_test: true
      upload_binary_artifact: false

  package-candidate:
    name: Package release candidate
    needs:
      - node-validation
      - cli-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.7"
          cache: true
          cache-dependency-path: tooling/subspace-cli/go.sum

      - name: Build registry
        working-directory: tooling/subspace-cli
        run: go run ./cmd/subspace-registry build --source ../../packages --out registry --source-git-sha "${{ inputs.source_sha }}"

      - name: Validate registry
        working-directory: tooling/subspace-cli
        run: go run ./cmd/subspace-registry validate --dir registry

      - name: Package release artifacts
        working-directory: tooling/subspace-cli
        run: |
          mkdir -p ../../dist
          ./scripts/build-release-binaries.sh ../../dist
          ./scripts/create-registry-archive.sh registry ../../dist "${{ inputs.release_version }}" "${{ inputs.source_sha }}"
          ./scripts/write-release-checksums.sh ../../dist

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: subspace-cli-release-${{ inputs.release_version }}
          path: |
            dist/subspace-cli-*
            dist/subspace-cli-registry.tar.gz
            dist/checksums.txt
            dist/release-metadata.json
          if-no-files-found: error

  publish:
    name: Publish release
    needs: package-candidate
    runs-on: ubuntu-24.04
    environment:
      name: subspace-cli-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: subspace-cli-release-${{ inputs.release_version }}
          path: dist

      - name: Build release notes
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          archive_name="subspace-cli-registry.tar.gz"
          archive_sha=$(awk -v name="$archive_name" '$2 == name { print $1 }' dist/checksums.txt)
          {
            echo "Subspace CLI release ${RELEASE_VERSION}"
            echo
            echo "Source commit: ${SOURCE_SHA}"
            echo "Registry archive SHA-256: ${archive_sha}"
            echo
            echo "Assets:"
            for asset in $(find dist -maxdepth 1 -type f ! -name 'release-notes.md' -exec basename {} \; | LC_ALL=C sort); do
              echo "- ${asset}"
            done
          } > dist/release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          tag_name: ${{ inputs.release_version }}
          target_commitish: ${{ inputs.source_sha }}
          name: ${{ inputs.release_version }}
          body_path: dist/release-notes.md
          files: |
            dist/subspace-cli-*
            dist/subspace-cli-registry.tar.gz
            dist/checksums.txt
            dist/release-metadata.json
