name: node-ci

on:
  push:
    paths-ignore:
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/reusable-cli-registry-ci.yml"
      - "tooling/subspace-cli/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  test:
    name: Node CI (Node ${{ matrix.node_version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - node_version: "22"
            upload_coverage: false
          - node_version: "24"
            upload_coverage: true
          - node_version: "25"
            upload_coverage: false
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      node_version: ${{ matrix.node_version }}
      upload_coverage: ${{ matrix.upload_coverage }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
