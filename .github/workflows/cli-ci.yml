name: cli-ci

on:
  push:
    paths:
      - ".github/workflows/registry-release.yml"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/reusable-cli-registry-ci.yml"
      - "tooling/subspace-cli/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  pull_request:
    paths:
      - ".github/workflows/registry-release.yml"
      - ".github/workflows/cli-ci.yml"
      - ".github/workflows/reusable-cli-registry-ci.yml"
      - "tooling/subspace-cli/**"
      - "**/*.go"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  test:
    name: Registry CLI CI
    uses: ./.github/workflows/reusable-cli-registry-ci.yml
    with:
      build_binary: true
      binary_output_path: /tmp/subspace-cli
      run_smoke_test: true
      upload_binary_artifact: false
